name: Build EXE & Release

on:
  push:
    tags:
      - 'v*'   # ⬅️ parte solo quando pushi un tag tipo v1.0.0
  workflow_dispatch:  # ⬅️ puoi comunque lanciarlo a mano se vuoi

permissions:
  contents: write  # necessario per creare la release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: cmd
        run: |
          pip install --upgrade pip
          if exist requirements.txt (
            pip install -r requirements.txt
          )
          pip install pyinstaller

      - name: Set UTF-8 for console
        run: chcp 65001
        shell: cmd

      - name: Generate version file
        run: |
          python make_version_file.py

      - name: Build with PyInstaller (.spec)
        run: |
          pyinstaller main.spec

      # 👉 CREA la Release basandosi sul tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}  # es: v1.0.0
          name: "Release ${{ github.ref_name }}"
          body: "🚀 Build automatica per ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 👉 CARICA l'eseguibile nella Release
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

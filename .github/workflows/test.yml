name: Test Build EXE (no release)

on:
  workflow_dispatch:  # lo lanci a mano da GitHub Actions
  push:
    branches:
      - main           # oppure rimuovi se vuoi lanciarlo solo manualmente

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { python -m pip install -r requirements.txt }
          python -m pip install pyinstaller

      - name: Set UTF-8 for console (Windows)
        shell: cmd
        run: chcp 65001

      - name: Generate version file
        shell: pwsh
        run: python make_version_file.py

      - name: Build with PyInstaller (.spec)
        shell: pwsh
        run: pyinstaller main.spec --noconfirm

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-build-exe
          path: |
            dist/**/*.exe
            dist/**/*.dll
            dist/**/*.pyd
